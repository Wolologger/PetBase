<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f1e6">
<title>PetBase · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- PetBase v1.0.0 -->
<style>
:root{
  --bg:#e8f1e6; --s1:#fffef8; --s2:#dbe8d6; --line:#bfd2bb; --tx:#15342b; --mu:#57746a;
  --ac:#cfe23a; --ac-ink:#1c2a05; --lk:#1f6b43; --stitch:rgba(21,52,43,.3); --go-ink:#ffffff;
  --t-nota:#7a55c9; --t-paseo:#1f8a5b; --t-vet:#d9483b; --t-med:#2d78d6; --t-cuidado:#118f86; --t-evento:#c27f08; --t-peso:#8a7550;
  --r-l:24px; --r-m:16px;
  --ff-d:'Fredoka','Nunito',system-ui,sans-serif;
  --ff:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:64px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1f1a; --s1:#182b24; --s2:#21382f; --line:#2e483d; --tx:#ecf2e2; --mu:#93ad9f;
  --ac:#d6ea3f; --ac-ink:#1b2604; --lk:#d6ea3f; --stitch:rgba(236,242,226,.22); --go-ink:#0d1f13;
  --t-nota:#c9a7f5; --t-paseo:#7fcf9a; --t-vet:#f07a6e; --t-med:#6fb3f2; --t-cuidado:#5fd0c4; --t-evento:#f2b84b; --t-peso:#c7b79a;
}}
:root[data-theme="dark"]{
  --bg:#0f1f1a; --s1:#182b24; --s2:#21382f; --line:#2e483d; --tx:#ecf2e2; --mu:#93ad9f;
  --ac:#d6ea3f; --ac-ink:#1b2604; --lk:#d6ea3f; --stitch:rgba(236,242,226,.22); --go-ink:#0d1f13;
  --t-nota:#c9a7f5; --t-paseo:#7fcf9a; --t-vet:#f07a6e; --t-med:#6fb3f2; --t-cuidado:#5fd0c4; --t-evento:#f2b84b; --t-peso:#c7b79a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 var(--ff);-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--lk);outline-offset:2px;border-radius:6px}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px calc(var(--nav-h) + 100px)}
.view{display:none}.view.on{display:block}

.demo{display:flex;align-items:center;gap:10px;background:var(--ac);color:var(--ac-ink);border-radius:14px;padding:9px 14px;font-weight:800;font-size:13.5px;margin-bottom:16px}
.demo svg{font-size:18px}
.demo button{margin-left:auto;font-weight:800;text-decoration:underline;color:inherit}

.dayhead{margin:4px 0 20px}
.dayhead .wd{font:600 17px var(--ff-d);color:var(--mu)}
.dayhead .big{font:700 clamp(58px,17vw,84px)/.9 var(--ff-d);letter-spacing:-.01em}
.dayhead .big small{display:block;font:500 clamp(20px,6vw,26px)/1.1 var(--ff-d);color:var(--mu);margin-top:6px}
h2.sec{display:flex;align-items:center;gap:10px;font:600 21px/1.2 var(--ff-d);margin:30px 0 12px}
h2.sec svg{color:var(--mu);font-size:20px}
h2.sec .more{margin-left:auto;font:700 14px var(--ff);color:var(--lk);display:flex;align-items:center;gap:2px}
h1.title{font:700 36px/1.05 var(--ff-d);margin:4px 0 18px}

/* Mascotas: chapas de collar */
.pets{display:flex;gap:18px;overflow-x:auto;padding:22px 4px 6px;scrollbar-width:none}
.pets::-webkit-scrollbar{display:none}
.pet{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:72px}
.av{flex:none;position:relative;isolation:isolate;width:68px;height:68px;border-radius:50%;background:var(--s2) center/cover;display:grid;place-items:center;font:700 26px var(--ff-d);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--pc,var(--line));color:var(--pc,var(--mu))}
.av:not(.sm):not(.add)::before{content:"";position:absolute;top:-15px;left:50%;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;border:3.5px solid var(--pc,var(--mu));z-index:-1}
.av.sm{width:26px;height:26px;font-size:12px;box-shadow:0 0 0 2px var(--s1),0 0 0 3.5px var(--pc,var(--line))}
.av.add{box-shadow:none;border:2.5px dashed var(--line);color:var(--mu);font-size:26px}
.pet span:last-child{font-size:14.5px;font-weight:700}

.card{background:var(--s1);border-radius:var(--r-l);padding:16px;outline:1.5px dashed var(--stitch);outline-offset:-7px}
.prompt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--s1);border-radius:var(--r-l);padding:18px;border:1.5px dashed var(--stitch)}
.prompt .pi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--t-nota) 18%,transparent);color:var(--t-nota);font-size:22px}
.prompt b{display:block;font:600 18px var(--ff-d)}
.prompt small{color:var(--mu);font-size:14px}

/* Notas: etiquetas con agujero */
.note{position:relative;background:var(--s1);border-radius:var(--r-l);padding:18px 18px 14px;border-left:5px solid var(--t-nota);margin-bottom:12px;outline:1.5px dashed var(--stitch);outline-offset:-8px}
.note::after{content:"";position:absolute;top:14px;right:16px;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.note p{white-space:pre-wrap;font-size:16.5px;line-height:1.55;padding-right:20px}
.meta{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mu);font-size:13.5px;flex-wrap:wrap;font-weight:600}
.stack{display:flex}.stack .av{margin-right:-6px}

.item{display:flex;gap:12px;align-items:flex-start;background:var(--s1);border-radius:var(--r-m);padding:13px 14px;margin-bottom:8px;position:relative;width:100%;text-align:left}
.item .ti{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;background:color-mix(in srgb,var(--tc) 17%,transparent);color:var(--tc)}
.item .bd{flex:1;min-width:0}
.item .bd b{display:block;font-weight:800;font-size:15.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.item .bd small{display:block;color:var(--mu);font-size:13.5px;margin-top:2px;font-weight:600}
.item .bd .ex{color:var(--tx);opacity:.85;font-size:14px;margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--mu);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.late{color:var(--t-vet)!important;font-weight:800!important}
.empty{color:var(--mu);padding:14px 2px;font-size:15px}
.dayl{font:600 16px var(--ff-d);color:var(--mu);margin:22px 2px 10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:99px;background:var(--s1);border:2px solid var(--line);font-size:14px;font-weight:700}
.chip.t{padding-left:13px}
.chip.on{border-color:var(--pc,var(--lk));background:color-mix(in srgb,var(--pc,var(--lk)) 16%,var(--s1))}
.chip .av.sm{box-shadow:none;width:24px;height:24px}

/* Paseos */
.walk{background:var(--s1);border-radius:var(--r-l);padding:20px;outline:1.5px dashed var(--stitch);outline-offset:-7px}
.walk .clock{font:700 62px/1 var(--ff-d);font-variant-numeric:tabular-nums;margin:8px 0 16px;color:var(--t-paseo)}
.walk.run{box-shadow:0 0 0 3px var(--t-paseo)}
.trail{display:flex;gap:6px;align-items:flex-end;min-height:210px;padding-top:6px}
.trail>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:12.5px;color:var(--mu);font-weight:700}
.trail .steps{display:flex;flex-direction:column-reverse;align-items:center;gap:1px}
.trail .steps svg{width:22px;height:22px;fill:var(--t-paseo);stroke:var(--t-paseo);stroke-width:1;opacity:.7}
.trail .steps .l{transform:translateX(-5px) rotate(-14deg)}
.trail .steps .r{transform:translateX(5px) rotate(14deg)}
.trail .today{color:var(--tx)}
.trail .today .steps svg{opacity:1}
.trail .mn{min-height:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--s1);border-radius:var(--r-m);padding:14px}
.stat b{font:700 25px/1.1 var(--ff-d);display:block;white-space:nowrap}
.stat small{color:var(--mu);font-size:13px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:99px;font-weight:800;font-size:15px;background:var(--s2);white-space:nowrap}
.btn.pri{background:var(--ac);color:var(--ac-ink)}
.btn.go{background:var(--t-paseo);color:var(--go-ink)}
.btn.dng{background:transparent;color:var(--t-vet);border:2px solid color-mix(in srgb,var(--t-vet) 50%,transparent)}
.btn.w{width:100%;white-space:normal;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}

.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font:600 25px var(--ff-d);text-transform:capitalize}
.ib{width:42px;height:42px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.grid .dw{text-align:center;font-size:12.5px;color:var(--mu);font-weight:800;padding:4px 0}
.grid .d{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;font-weight:700;font-size:15px}
.grid .d.out{opacity:.3}
.grid .d.tod{box-shadow:inset 0 0 0 2.5px var(--lk)}
.grid .d.sel{background:var(--s1)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:30px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}

/* Botón flotante: pelota de tenis */
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:30px;box-shadow:0 8px 22px rgba(0,0,0,.32);z-index:20}
.fab svg{position:relative;z-index:1;stroke-width:2.6}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:21}
nav.bot div{max-width:640px;margin:0 auto;display:flex;height:var(--nav-h)}
nav.bot button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mu)}
nav.bot button svg{font-size:22px}
nav.bot button.on{color:var(--tx)}
nav.bot button.on svg{color:var(--lk)}

.scrim{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;background:var(--s1);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:600 25px var(--ff-d);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet h3 .x{margin-left:auto}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.types button{background:var(--s2);border-radius:20px;padding:18px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;font-size:14px}
.types .ti{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--tc);color:#15110a}
.f{margin-bottom:14px}
.f label{display:block;font-size:13.5px;font-weight:700;color:var(--mu);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px}
.f textarea{min-height:120px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--lk)}
.tog{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:700}
.tog input{width:22px;height:22px;accent-color:var(--lk)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;background:var(--c)}
.swatches button.on{box-shadow:0 0 0 3px var(--s1),0 0 0 5px var(--c)}
.photo{display:flex;align-items:center;gap:14px}
.help{font-size:13px;color:var(--mu);margin-top:6px}
.petdet{display:flex;gap:18px;align-items:center;margin:8px 0 14px}
.petdet .av{width:84px;height:84px;font-size:32px}
.petdet b{font:700 30px/1.1 var(--ff-d);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:6px 0 16px}
.kv dt{color:var(--mu)}
.list-set button{display:flex;align-items:center;gap:12px;width:100%;padding:15px 4px;border-bottom:1.5px solid var(--line);font-weight:700;text-align:left}
.list-set button svg{font-size:20px;color:var(--mu)}
.list-set button span{margin-left:auto;color:var(--mu);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:99px;font-weight:700;font-size:14.5px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--ac);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sdot.err,.dot.err{background:var(--t-vet)}

.me{position:relative}
.sdot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);background:var(--mu)}
.sdot.ok{background:var(--t-paseo)}
.sdot.pend{background:var(--t-evento)}
.sdot.busy{background:var(--lk);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.dot.pend{background:var(--t-evento)}
.dot.off{background:var(--mu)}
.dot.busy{background:var(--lk);animation:pulse 1s infinite}
.optlist .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);margin-bottom:8px;background:var(--s1)}
.optlist .opt.on{border-color:var(--lk);background:color-mix(in srgb,var(--lk) 10%,var(--s1))}
.optlist .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mu);margin-top:2px;position:relative}
.optlist .on .rd{border-color:var(--lk)}
.optlist .on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--lk)}
.optlist b{display:block;font-weight:800}
.optlist small{display:block;color:var(--mu);font-weight:600;font-size:13px}
.cmpcard{padding:12px 12px 14px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px minmax(78px,auto);align-items:center}
.cmp>*{padding:8px 4px;border-top:1px solid var(--line);font-size:14px;min-width:0}
.cmp>.h{border-top:0;font-size:12px;font-weight:800;color:var(--mu);display:flex;align-items:center;gap:4px;justify-content:center}
.cmp>.h em{font-style:normal}
.cmp>b{text-align:center;font:600 16px var(--ff-d)}
.cmp .stc{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cmp .tot{color:var(--mu);font-weight:700}
.st{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.st.up{background:color-mix(in srgb,var(--t-paseo) 20%,transparent);color:var(--t-paseo)}
.st.dn{background:color-mix(in srgb,var(--t-med) 20%,transparent);color:var(--t-med)}
.st.cf{background:color-mix(in srgb,var(--t-evento) 24%,transparent);color:var(--t-evento)}

[data-b="lisa"]{background-color:var(--ba);background-image:radial-gradient(ellipse 48% 48% at 31% 26%,rgba(255,255,255,.8),rgba(255,255,255,0)),radial-gradient(ellipse 78% 78% at 36% 30%,rgba(3,33,43,0) 50%,rgba(3,33,43,.42));color:var(--bi)}
.cprev{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px;margin-bottom:12px;border:1.5px solid var(--line)}
.cp-card{flex:1;min-width:0;border-radius:12px;padding:8px 10px;line-height:1.25}
.cp-card b{display:block;font-size:14px}
.cp-card small{font-size:12px;font-weight:700}
.cp-btn{padding:8px 12px;border-radius:99px;font-weight:800;font-size:13px}
.cprev .ballp{width:40px;height:40px;box-shadow:none}
.crow{display:flex;flex-direction:column;gap:8px}
.crow input[type=color]{width:100%;height:44px;padding:3px;border:2px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer}
.swatches.sm{gap:6px;flex-wrap:nowrap}
.swatches.sm button{width:100%;max-width:34px;aspect-ratio:1;height:auto;flex:1}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:16px;border:2px solid var(--line);font-weight:700;font-size:13px;background:var(--bg)}
.bopt.on{border-color:var(--lk);background:color-mix(in srgb,var(--lk) 10%,var(--s1))}
.bopt .ballp{width:44px;height:44px}
@media (max-height:700px){.sheet .cprev{padding:8px 10px;margin-bottom:8px}.sheet .crow input[type=color]{height:38px}.sheet .bopt{padding:7px 4px 6px}.sheet .bopt .ballp{width:38px;height:38px}}

.toast.warn .tic{background:var(--t-evento);color:#1f1300}
.warnline{display:flex;align-items:center;gap:6px;color:var(--t-evento);font-weight:800;font-size:13px;margin:4px 0 8px}
.warnline svg{font-size:16px;flex:none}
small.warnline{display:flex;margin:3px 0 0;color:var(--t-evento)}
.doseout{margin:0 0 6px}
.doseline{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:12px;padding:7px 10px;margin-bottom:6px;font-size:14px;justify-content:space-between}
.doseline span:nth-child(2){font-weight:800;margin-left:auto}
.calseg{margin-bottom:10px}
.wkgrid{display:block}
.wkday h3{font:600 16px var(--ff-d);color:var(--mu);margin:16px 2px 8px}
.wkday.now h3{color:var(--lk)}
.dayl.late{color:var(--t-vet)}
.qt .chips{margin-bottom:8px}
.qwhere{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;color:var(--mu);font-size:13.5px}
.qwhere .seg{flex:1}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:color-mix(in srgb,var(--tc) 14%,var(--s1));font-weight:800;font-size:13px;transition:transform .1s}
.qbtn:active{transform:scale(.95)}
.qi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#15110a;font-size:19px;flex:none}

.heat i.h2{background:color-mix(in srgb,var(--t-paseo) 62%,var(--s2));color:var(--tx)}

.sheet h3{font-size:22px;margin-bottom:12px}
.row>.f{flex:1 1 120px;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--lk);box-shadow:0 0 0 4px color-mix(in srgb,var(--lk) 22%,transparent)}

.wzprog{display:flex;gap:6px;margin:-4px 0 6px}

.tgls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.tgl span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;border:2px solid var(--line);font-weight:700;background:var(--bg)}
.tgl input:checked+span{border-color:var(--lk);background:color-mix(in srgb,var(--lk) 14%,var(--s1))}

.acc{margin-bottom:10px}

.acc-h>svg:last-child{margin-left:auto;font-size:18px;color:var(--mu);transition:transform .2s}
.acc.open .acc-h{border-color:var(--lk)}

.vlist{margin-top:10px}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;color:var(--mu)}

.vnote{margin-bottom:8px}
.dotc{width:20px;height:20px;border-radius:50%}

.toast.ok .tic{background:var(--ac);color:var(--ac-ink)}

.tmsg{min-width:0}
.tbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:currentColor;opacity:.3;transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.sheet-open .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-20px)}
.sheet-open .toast.on{transform:translate(-50%,0)}
.loader{position:fixed;inset:0;z-index:70;background:rgba(5,15,10,.45);display:grid;place-items:center}

.lstage{position:relative;height:96px;width:70px;margin:0 auto}
.lball{position:absolute;left:50%;bottom:16px;width:44px;height:44px;margin-left:-22px;border-radius:50%;overflow:hidden;--ba:var(--ac);--bi:var(--ac-ink);animation:bnc .85s infinite}
.lshadow{position:absolute;left:50%;bottom:6px;width:42px;height:8px;margin-left:-21px;border-radius:50%;background:rgba(0,0,0,.28);animation:shd .85s infinite}
@keyframes bnc{0%,100%{transform:translateY(0) scale(1.12,.88);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-44px) scale(1);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.5);opacity:.14}}
.ptrail{position:relative;width:100px;height:104px;margin:0 auto 4px}
.ptrail svg{position:absolute;width:28px;height:28px;fill:var(--t-paseo);stroke:var(--t-paseo);stroke-width:1;opacity:0;animation:pw 1.6s infinite}
.ptrail svg:nth-child(1){left:12px;bottom:0;transform:rotate(-14deg)}
.ptrail svg:nth-child(2){left:58px;bottom:26px;transform:rotate(14deg);animation-delay:.3s}
.ptrail svg:nth-child(3){left:12px;bottom:54px;transform:rotate(-14deg);animation-delay:.6s}
.ptrail svg:nth-child(4){left:58px;bottom:80px;transform:rotate(14deg);animation-delay:.9s}
@keyframes pw{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.mini{display:inline-block;width:18px;height:18px;border-radius:50%;overflow:hidden;position:relative;--ba:var(--ac);--bi:var(--ac-ink);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn[disabled]{opacity:.75;pointer-events:none}

.pal .sws{display:flex;gap:4px;margin-top:5px}
.pal .sws i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.wkstrip{display:flex;gap:6px;margin:0 0 10px}
.wkstrip span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--mu);font-weight:700}
.wkstrip i{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--s2);margin-bottom:4px}
.wkstrip .on i{background:var(--t-paseo)}
.wkstrip .now{color:var(--tx)}
.wkmini{display:block;width:100%;text-align:left}
.wkmini p{font-weight:700;font-size:14.5px}
.wkmini small{display:block;color:var(--lk);font-weight:800;margin-top:6px}

:root{--t-comida:#b0602a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-comida:#e8a06a}}
:root[data-theme="dark"]{--t-comida:#e8a06a}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.bar{display:block;height:8px;border-radius:99px;background:var(--s2);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--t-comida)}
.sack .left{display:block;font-weight:800;font-size:14px}
.sack .dur{display:block;font-size:13.5px;font-weight:700;color:var(--mu);margin-top:2px}
.calcout{margin-top:6px;padding-top:14px;border-top:1.5px solid var(--line)}
.cbig{font:700 44px/1 var(--ff-d)}
.cbig span{font-size:22px;color:var(--mu);font-weight:500}
.csub{color:var(--mu);font-weight:700;margin:6px 0 12px}
.calcout .kv{margin:0}

.tools{display:flex;align-items:center;gap:10px}
.me{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font:700 24px var(--ff-d);flex:none}
.me.off{background:var(--s2);color:var(--mu);font-size:26px}
.me.sm{width:42px;height:42px;font-size:18px}
.me[hidden]{display:none}
.acct-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.acct-top>div{min-width:0}
.acct-top b{display:block;font:600 19px/1.2 var(--ff-d)}
.acct-top small{display:block;color:var(--mu);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.syncline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mu);margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--t-paseo);flex:none}
.acct-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--s2)}
.acct-opt b{display:block;font-weight:800}
.acct-opt small{color:var(--mu);font-weight:600}

body{min-height:100dvh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;margin:-18px -18px 6px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font:700 23px var(--ff-d)}
.brand svg{color:var(--lk);font-size:25px}
.ib.on{background:var(--ac);color:var(--ac-ink)}
.cols{display:block}
.col{min-width:0}
.col>h2.sec:first-child{margin-top:6px}
.seg{display:flex;background:var(--bg);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:99px;font-weight:800;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--ac-ink)}
.list-set.inner{padding:6px 16px}
.list-set.inner button:last-child{border-bottom:0}
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.petcard{display:flex;flex-direction:column;gap:16px;text-align:left;background:var(--s1);border-radius:var(--r-l);padding:28px 20px 20px;outline:1.5px dashed var(--stitch);outline-offset:-7px}
.petcard .ph{display:flex;align-items:center;gap:16px}
.petcard .pn b{display:block;font:600 22px/1.15 var(--ff-d)}
.petcard .pn small{color:var(--mu);font-weight:600;font-size:13.5px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats b{display:block;font:600 18px/1.2 var(--ff-d);white-space:nowrap}
.pstats small{color:var(--mu);font-size:12px;font-weight:600}
.pnext{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--mu)}
.pnext i{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
.addcard{align-items:center;justify-content:center;min-height:190px;color:var(--mu);font-weight:800}
.sheet{margin:0 auto}
@media (hover:hover){
  .item[role=button]:hover,.petcard:hover,.chip:hover,.prompt:hover,.note:hover{filter:brightness(.97)}
  .btn:hover,.ib:hover{filter:brightness(1.07)}
}
@media (max-width:380px){
  .wrap{padding-left:14px;padding-right:14px}
  .top{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .btn{padding:12px 12px;font-size:14px}

  .walk .clock{font-size:52px}
  nav.bot button{font-size:11px}
  .types{gap:8px}
  .grid .d{font-size:14px}
  .pstats b{font-size:16px}
  .stat b{font-size:22px}
}

}
@media (min-width:760px){
  body{padding-left:96px}
  .wrap{max-width:820px;padding:24px 40px 60px}
  .top{margin:-24px -40px 10px;padding:14px 40px}
  nav.bot{top:0;right:auto;width:96px;border-top:0;border-right:1.5px solid var(--line);padding:0}
  nav.bot div{max-width:none;flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 10px 0;height:100%}
  nav.bot button{flex:none;height:76px;font-size:12.5px;border-radius:20px}
  nav.bot button.on{background:color-mix(in srgb,var(--ac) 24%,transparent)}
  .fab{right:36px;bottom:36px}
  .toast{left:calc(50% + 48px);bottom:36px}
  h1.title{font-size:44px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px,92vw);max-height:88vh;border-radius:28px;padding:24px 26px 26px;margin:0;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}
@media (min-width:960px){
  .wrap{max-width:1120px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:start}
}
@media (min-width:1280px){
  .wrap{max-width:1240px}
  .petgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}

  return `<span class="av${sm?' sm':''}" style="${st}" title="${esc(p.name)}">${p.photo ? '' : esc(p.name.charAt(0).toUpperCase())}</span>`;
}
const stack = ids => `<span class="stack">${(ids||[]).map(id => avatar(petById(id),1)).join('')}</span>`;
const petNames = ids => (ids||[]).map(id => petById(id)?.name).filter(Boolean).join(', ');

function entryTitle(e){
  switch(e.type){
    case 'nota': return (e.text||'').split('\n')[0].slice(0,80) || 'Nota';
    case 'paseo': return `Paseo · ${fmtMin(e.duration)}` + (e.distance ? ` · ${e.distance} km` : '');
    case 'peso': return `${e.weight} kg`;
    case 'comida': return `Comida · ${e.grams} g`;
    case 'toque': return (TOQUES[e.kind] ? TOQUES[e.kind].label : 'Toque') + (e.where ? ' ' + e.where : '');
    default: return e.title || TYPES[e.type].label;
  }
}
function entrySub(e){
  const bits = [];
  if (e.type === 'paseo'){ if (e.pis) bits.push('pis'); if (e.caca) bits.push('caca'); }
  { const dt = doseText(e); if (dt) bits.push(dt); }
  if (e.type === 'vet'){ if (e.kind && KINDS[e.kind]) bits.push(KINDS[e.kind]); if (e.log?.length) bits.push(e.log.length + (e.log.length === 1 ? ' nota' : ' notas')); }
  if (e.type === 'comida'){ const k = sackById(e.sackId); if (k) bits.push(k.brand + (k.product ? ' ' + k.product : '')); }
  if (e.place) bits.push(e.place);
  if (e.cost) bits.push(`${e.cost} €`);
  { const rt = recText(e); if (rt) bits.push(rt.toLowerCase()); }
  return bits.join(' · ');
}
function itemHTML(e, opts = {}){
  const T = e.type === 'toque' && TOQUES[e.kind] ? {icon:TOQUES[e.kind].icon, c:TOQUES[e.kind].c} : TYPES[e.type], sched = SCHEDULED.includes(e.type) && !e.done;
  const late = sched && e.date < today();
  const when = (opts.noDate ? '' : fmtDay(e.date)) + (e.time ? (opts.noDate ? '' : ', ') + e.time : '');
  const sub = [when, entrySub(e)].filter(Boolean).join(' · ');
  const ex = e.type !== 'nota' && e.text ? `<div class="ex">${esc(e.text)}</div>` : '';
  const chk = SCHEDULED.includes(e.type)
    ? `<button class="chk${e.done?' on':''}" aria-label="${e.done?'Marcar pendiente':'Marcar hecho'}" onclick="event.stopPropagation();toggleDone('${e.id}')">${svg('chk')}</button>` : '';
  return `<div class="item" role="button" tabindex="0" style="--tc:var(${T.c})" onclick="openEntry('${e.id}')">
    <span class="ti">${svg(T.icon)}</span>
    <span class="bd"><b>${esc(entryTitle(e))}</b><small class="${late?'late':''}">${late?'Atrasado · ':''}${esc(sub)}</small>${conflictLine(e)}${ex}</span>
    <span class="rt">${chk}${stack(e.petIds)}</span></div>`;
}
function noteHTML(e){
  return `<div class="note" role="button" tabindex="0" onclick="openEntry('${e.id}')">
    <p>${esc(e.text)}</p>
    <div class="meta">${stack(e.petIds)}<span>${e.petIds?.length ? esc(petNames(e.petIds)) : 'General'}</span>${e.time?`<span>· ${e.time}</span>`:''}</div></div>`;
}
function toggleDone(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  e.done = !e.done;
  let created = null;
  const nx = e.done && !e.spawned ? nextOcc(e) : null;
  if (nx){
    created = {...e, id:uid(), date:nx.date, time:nx.time, done:false, spawned:false, occ:(e.occ || 1) + 1};
    e.spawned = created.id;
    S.entries.push(created);
  }
  save(); renderAll();
  if (e.done) toast(created ? `Hecho. Siguiente: ${fmtDay(created.date)}${created.time ? ', ' + created.time : ''}` : 'Hecho', () => {
    e.done = false;
    if (created){ S.entries = S.entries.filter(x => x.id !== created.id); e.spawned = false; }
    save(); renderAll();
  });
}
function nextDate(s, r){
  const d = parse(s);
  if (r === 'day') d.setDate(d.getDate()+1);
  if (r === 'week') d.setDate(d.getDate()+7);
  if (r === 'month') d.setMonth(d.getMonth()+1);
  if (r === 'year') d.setFullYear(d.getFullYear()+1);
  return iso(d);
}
const sortDesc = (a,b) => (b.date+(b.time||'99')).localeCompare(a.date+(a.time||'99'));
const sortAsc  = (a,b) => (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99'));
const pending = () => S.entries.filter(e => SCHEDULED.includes(e.type) && !e.done).sort(sortAsc);
const hist = () => S.entries.filter(e => e.type !== 'comida' && e.type !== 'toque' && (!SCHEDULED.includes(e.type) || e.done)).sort(sortDesc);

// ── Paseo con cronómetro (sobrevive a recargas: guarda la hora de inicio)
let tick = null;
function walkCard(compact, n, min){
  const w = S.walk;
  if (w){
    return `<div class="walk run"><div class="meta" style="margin:0">${stack(w.petIds)}<span>${esc(petNames(w.petIds)) || 'Paseo en curso'}</span></div>
      <div class="clock" id="clock">${clockTxt()}</div>
      <div class="row"><button class="btn go" onclick="stopWalk()">${svg('stop')}Terminar paseo</button>
      <button class="btn" onclick="cancelWalk()">Descartar</button></div></div>`;
  }
  return `<div class="walk">${compact ? `<p style="margin-bottom:12px">${n ? `<b>${n} ${n===1?'paseo':'paseos'}</b> · ${fmtMin(min)}` : '<span style="color:var(--mu)">Aún no habéis salido hoy</span>'}</p>` : ''}
    <div class="row"><button class="btn go" onclick="startWalk()">${svg('play')}Salir de paseo</button>
    <button class="btn" onclick="editEntry(null,'paseo')">Apuntar uno</button></div></div>`;
}
function clockTxt(){
  if (!S.walk) return '0:00';
  const s = Math.floor((Date.now() - S.walk.start)/1000);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
}
function startTick(){
  clearInterval(tick);
  if (S.walk) tick = setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = clockTxt(); }, 1000);
}
function startWalk(){
  if (!S.pets.length){ toast('Primero añade una mascota'); return editPet(); }
  pickPets('¿Quién sale?', S.pets.filter(p => p.species === 'Perro').map(p => p.id), ids => {
    S.walk = {start:Date.now(), petIds:ids}; save(); startTick(); closeSheet(); renderAll(); toast('Paseo en marcha');
  });
}
function stopWalk(){
  const w = S.walk; if (!w) return;
  const mins = Math.max(1, Math.round((Date.now()-w.start)/60000));
  const st = new Date(w.start);
  S.walk = null; save(); clearInterval(tick);
  editEntry(null, 'paseo', {petIds:w.petIds, duration:mins, date:iso(st), time:`${pad(st.getHours())}:${pad(st.getMinutes())}`});
  renderAll();
}
function cancelWalk(){ if (!confirm('¿Descartar este paseo?')) return; S.walk = null; save(); clearInterval(tick); renderAll(); toast('Paseo descartado'); }

function rPaseos(){
  const t = today(), days = [];

    days.push({d, m:S.entries.filter(e => e.type==='paseo' && e.date===d).reduce((a,e) => a+(+e.duration||0), 0)});

  const perPet = S.pets.map(p => ({p, m:week.filter(e => e.petIds?.includes(p.id)).reduce((a,e) => a+(+e.duration||0),0)})).filter(x => x.m);

      return `<div class="${x.d===t?'today':''}" title="${fmtMin(x.m)}"><span class="mn">${x.m?Math.round(x.m):''}</span><span class="steps">${Array.from({length:n},(_,i) => `<svg viewBox="0 0 24 24" class="${i%2?'r':'l'}" aria-hidden="true">${IC.paw}</svg>`).join('')}</span>${parse(x.d).toLocaleDateString('es-ES',{weekday:'narrow'})}</div>`; }).join('')}</div>
      <p class="help" style="text-align:center">Una huella por cada 10 minutos de paseo</p></div>
    <div class="stats"><div class="stat"><b>${fmtMin(wMin)}</b><small>últimos 7 días · ${week.length} ${week.length===1?'paseo':'paseos'}</small></div>
      <div class="stat"><b>${wKm ? wKm.toFixed(1)+' km' : '—'}</b><small>distancia apuntada</small></div></div>

    <h2 class="sec">Historial</h2>

// ── Calendario
let calM = new Date(); calM.setDate(1); let calSel = today();
function rCal(){
  if (calView === 'semana') return rCalWeek();
  if (calView === 'agenda') return rCalAgenda();
  const y = calM.getFullYear(), m = calM.getMonth();
  const first = new Date(y,m,1), off = (first.getDay() - weekStartDay() + 7) % 7, start = new Date(y,m,1-off);
  const calScope = S.entries.filter(e => e.type !== 'comida' && e.type !== 'toque'), byDay = {}; applyFlt(calScope, FLT.cal).forEach(e => (byDay[e.date] ||= []).push(e));
  let cells = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const k = iso(d);
    if (i >= 35 && d.getMonth() !== m) break;
    const types = [...new Set((byDay[k]||[]).map(e => e.type))].slice(0,4);
    cells += `<button class="d${d.getMonth()!==m?' out':''}${k===today()?' tod':''}${k===calSel?' sel':''}" onclick="calSel='${k}';rCal()">${d.getDate()}
      <span class="dots">${types.map(t => `<i style="--tc:var(${TYPES[t].c})"></i>`).join('')}</span></button>`;
  }
  const dayL = (byDay[calSel]||[]).sort(sortAsc);
  const pend = applyFlt(pending(), FLT.cal), filtered = fltCount(FLT.cal) > 0;
  document.getElementById('v-calendario').innerHTML = `
    ${calHead(calScope)}
    <div class="cols"><div class="col"><div class="calh"><button class="ib" aria-label="Mes anterior" onclick="calM.setMonth(calM.getMonth()-1);rCal()">${svg('chevL')}</button>
      <b>${first.toLocaleDateString('es-ES',{month:'long', year:'numeric'})}</b>
      <button class="ib" aria-label="Mes siguiente" onclick="calM.setMonth(calM.getMonth()+1);rCal()">${svg('chevR')}</button></div>
    <div class="grid">${dowLabels().map(x => `<div class="dw">${x}</div>`).join('')}${cells}</div>
    </div><div class="col">
    <h2 class="sec">${fmtDay(calSel,1)}</h2>
    ${dayL.length ? dayL.map(e => e.type==='nota' ? noteHTML(e) : itemHTML(e,{noDate:1})).join('') : (filtered ? '<p class="empty">Nada este día con estos filtros.</p>' : '<p class="empty">Nada este día.</p>')}
    <h2 class="sec">${svg('cal')}Todo lo pendiente</h2>
    ${pend.length ? pend.map(e => itemHTML(e)).join('') : (filtered ? '<p class="empty">Nada pendiente con estos filtros.</p>' : '<p class="empty">Nada pendiente.</p>')}
    ${pend.length ? `<button class="btn w" style="margin-top:10px" onclick="exportICS(true)">${svg('dl')}Exportar ${filtered ? pend.length + ' filtrados' : 'a Google/Outlook'} (.ics)</button>` : ''}</div></div>`;
}

function rAjustes(){

      check:() => petsOk() || (+inputVal('e-grams') > 0 ? null : {m:'Indica la cantidad', f:'#e-grams'})}];
  }
  else if (k === 'peso') steps = [{name:'El peso', focus:'#e-weight',

    check:() => petsOk() || (+inputVal('e-weight') > 0 ? null : {m:'Indica el peso', f:'#e-weight'})}];

      check:() => need('e-title', 'Ponle un nombre') || petsOk()},

function saveEntry(){
  const {e, isNew} = window._editing;
  const g = id => document.getElementById(id);
  const val = id => g(id) ? g(id).value.trim() : undefined;
  const d = {...e, petIds:pickedIds(), date:val('e-date') || today(), time:val('e-time') || ''};
  ['title','text','dose','place','treatment'].forEach(f => { if (g('e-'+f)) d[f] = val('e-'+f); });
  ['duration','distance','cost','weight','grams','mgkg','mgunit'].forEach(f => { if (g('e-'+f)) d[f] = val('e-'+f) === '' ? '' : +val('e-'+f); });
  ['pis','caca','done'].forEach(f => { if (g('e-'+f)) d[f] = g('e-'+f).checked; });
  if (g('e-rp')) d.rec = readRec();
  if (g('e-sack')) d.sackId = g('e-sack').value;
  if (g('e-kind')) d.kind = g('e-kind').value;
  if (g('e-next')) d.next = g('e-next').value;
  if (d.type === 'nota' && !d.text) return toast('Escribe algo en la nota');
  if (['vet','med','cuidado','evento'].includes(d.type) && !d.title) return toast('Ponle un nombre');
  if (d.type === 'paseo' && !(d.duration > 0)) return toast('Indica la duración');
  if (d.type === 'peso' && !(d.weight > 0)) return toast('Indica el peso');
  if (d.type === 'comida' && !(d.grams > 0)) return toast('Indica la cantidad');
  if (d.type !== 'nota' && d.type !== 'evento' && !d.petIds.length && S.pets.length) return toast('Elige al menos una mascota');
  if (!SCHEDULED.includes(d.type)) d.done = true;
  const wasDone = !isNew && e.done;
  if (isNew){ d.id = uid(); d.created = Date.now(); S.entries.push(d); }
  else { const cur = S.entries.find(x => x.id === e.id); if (cur) mergeEdit(cur, d, (window._editing && window._editing.snap) || e); else S.entries.push(d); }
  if (d.type === 'vet') vetLinks(isNew ? d : S.entries.find(x => x.id === e.id));
  save(); closeSheet(); renderAll();
  { const ref = S.entries.find(x => x.id === (d.id || e.id)), cf = ref ? conflictsFor(ref) : [], base = isNew ? (SAVED[d.type] || 'Guardado') : 'Cambios guardados';
    if (cf.length) toast(base + ' · Ojo: choca con ' + (cf[0].title || TYPES[cf[0].type].label) + ' (' + cf[0].time + ')', null, 'warn'); else toast(base); }
  if (SCHEDULED.includes(d.type) && d.done && !wasDone && getRec(d) && !d.spawned){
    const ref = S.entries.find(x => x.id === (d.id||e.id)); ref.done = false; toggleDone(ref.id);
  }
}
function delEntry(){
  const {e} = window._editing;
  const i = S.entries.findIndex(x => x.id === e.id); if (i < 0) return;
  const [rem] = S.entries.splice(i,1);
  save(); closeSheet(); renderAll();
  toast('Borrado', () => { S.entries.splice(i,0,rem); save(); renderAll(); });
}

    (n > 1 ? `<div class="wzprog">${o.steps.map(() => '<i></i>').join('')}</div><p class="wzname" id="wzname"></p>` : '') +

const SE = PetBaseSync;

// ── estado que se enseña
const errText = k => ({retry:'Sin conexión con la nube. Tus cambios esperan y se reintentará solo', auth:'La sesión de la nube ha caducado. Vuelve a iniciar sesión', schema:'Hay datos de una versión más nueva de la app. Actualiza para seguir sincronizando', data:'Algo no se pudo subir. Mira los detalles en Datos'})[k] || 'Error de sincronización';
let PEND_MEMO = null;

  const up = SE.dirtyCount(S), items = Object.keys(REMOTE).length ? SE.previewDiff(S, REMOTE) : [], down = items.filter(i => i.down).length;
  const d = {up, down, total:up + down, items}; PEND_MEMO = {v:SYNC_VER + ':' + REMOTE_VER, d}; return d;
}
function statusInfo(){
  if (!S.account) return {k:'off', t:'Sin sesión'};

  const p = pendingInfo();
  if (S.sync.mode === 'auto' && SYNCST.live) return {k:p.total ? 'pend' : 'ok', t:p.total ? `${p.total} ${p.total === 1 ? 'cambio' : 'cambios'} en camino` : 'En tiempo real · todo al día'};

const hmOf = ts => new Date(ts).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
const dayWord = ts => { const d = iso(new Date(ts)); return d === today() ? 'hoy' : fmtDay(d).toLowerCase(); };
const syncState = () => statusInfo().k;
function syncLine(){

// ── ejecutar una sincronización
function syncFail(e, silent){
  const kind = SE.classifyError(e); SYNCST.err = {kind, msg:String((e && e.message) || e), code:(e && e.code) || '', at:Date.now()};
  if (kind === 'retry' && S.account && S.sync.mode === 'auto'){ clearTimeout(SYNCST.timer); const ms = SE.backoff(SYNCST.retry++); SYNCST.next = Date.now() + ms; SYNCST.timer = setTimeout(() => { if (S.account && S.sync.mode === 'auto') runSync('sync', {silent:true}); }, ms); }

  renderChrome(); if (view === 'datos') rDatos();
}
function syncMsg(mode, st, first){
  const p = [];
  if (st.sent) p.push(st.sent + (st.sent === 1 ? ' enviado' : ' enviados'));
  if (st.pulled) p.push(st.pulled + (st.pulled === 1 ? ' recibido' : ' recibidos'));
  if (st.big && st.big.length) p.push(st.big.length + ' demasiado grande' + (st.big.length === 1 ? '' : 's') + ' para subir');
  if (first && st.sent) return 'Copia en la nube creada · ' + st.sent + ' elementos';
  if (!p.length) return mode === 'sync' ? 'Todo al día' : mode === 'push' ? 'Subido · sin cambios' : 'Bajado · sin cambios';

}
async function runSync(mode, o){
  o = o || {};

  if (isOffline()){ if (!o.silent) toast('No hay conexión con la nube'); return; }
  if (SYNCING){ SYNCST.again = true; return; }
  const labels = {sync:'Sincronizando…', push:'Subiendo a la nube…', pull:'Bajando de la nube…'};
  const exec = async () => {
    SYNCING = true; renderChrome(); if (view === 'datos') rDatos();
    const first = !S.sync.last; let st = null, ok = false;
    try{
      const ad = adapter();
      if (mode === 'sync') st = await SE.sync(S, clock(), ad);
      else {
        await SE.syncOffset(S, clock(), ad);
        if (mode === 'pull'){ const r = await SE.pull(S, clock(), ad); st = {pulled:r.changed, sent:0, big:[]}; }
        else { const r = await SE.push(S, clock(), ad); st = {pulled:0, sent:r.sent, big:r.big}; }

}

async function fbInit(){

    else { AU.connectAuthEmulator(auth, `http://${em.host}:${em.authPort}`, {disableWarnings:true}); FS.connectFirestoreEmulator(db, em.host, em.fsPort); }
  }

function sackStats(k){
  const n = Math.max(1, (k.petIds || []).length);
  const rate = (+k.meals || 0) * (+k.grams || 0) * n;
  const logs = S.entries.filter(e => e.type === 'comida' && e.sackId === k.id);
  const per = e => (+e.grams || 0) * Math.max(1, (e.petIds || []).length);
  const logged = logs.reduce((a, e) => a + per(e), 0);
  const daysOpen = Math.max(0, Math.round((parse(today()) - parse(k.opened || today())) / 864e5));
  const used = logs.length ? logged : rate * daysOpen;
  const total = (+k.kg || 0) * 1000;

  const dset = new Set(rec.map(e => e.date));
  const avg = dset.size >= 2 ? rec.reduce((a, e) => a + per(e), 0) / dset.size : null;

}

const weekStartDay = () => S.settings?.weekStart === 0 ? 0 : 1;

let rsP = 'semana', rsOff = 0;
function periodRange(p, off){

  if (p === 'semana'){ const st = addDays(weekStartOf(t), off * 7); return {start:st, end:addDays(st, 6)}; }
  if (p === 'mes'){ const b = parse(t), a = new Date(b.getFullYear(), b.getMonth() + off, 1), z = new Date(b.getFullYear(), b.getMonth() + off + 1, 0); return {start:iso(a), end:iso(z)}; }
  if (p === 'anio'){ const y = parse(t).getFullYear() + off; return {start:y + '-01-01', end:y + '-12-31'}; }

  if (p === 'semana') return {main:rangeLabel(r), sub:off === 0 ? 'Esta semana' : off === -1 ? 'Semana pasada' : `Hace ${-off} semanas`};
  if (p === 'mes') return {main:cap(parse(r.start).toLocaleDateString('es-ES', {month:'long', year:'numeric'})), sub:off === 0 ? 'Este mes' : off === -1 ? 'Mes pasado' : `Hace ${-off} meses`};

}

  const tq = (k, l) => (l || toques).filter(e => e.kind === k).reduce((a, e) => a + Math.max(1, (e.petIds || []).length), 0);

      ${Object.keys(groups).length ? Object.entries(groups).map(([y, es]) => `<div class="dayl">${y}</div>` + es.map(e => itemHTML(e)).join('')).join('') : '<p class="empty">Aún no hay visitas. Apunta la primera con «Nueva visita».</p>'}

function shareFicha(){
  const p = petById(fichaId); if (!p) return;
  const L = S.entries.filter(e => e.petIds?.includes(p.id));
  const vets = L.filter(e => e.type === 'vet' && e.done).sort(sortDesc);
  const w = L.filter(e => e.type === 'peso' && +e.weight > 0).sort(sortDesc)[0];
  const meds = L.filter(e => e.type === 'med' && !e.done);
  const t = [`Ficha de ${p.name}`, [p.species, p.breed, age(p.birth), p.sex].filter(Boolean).join(' · '), p.chip ? 'Chip: ' + p.chip : null, p.clinic ? 'Clínica habitual: ' + p.clinic : null,
    w ? `Peso: ${nf(w.weight)} kg (${fmtDay(w.date).toLowerCase()})` : null, p.conditions ? 'Alergias y condiciones: ' + p.conditions : null,
    vets.filter(e => e.kind === 'vacuna').length ? 'Vacunas: ' + vets.filter(e => e.kind === 'vacuna').map(e => `${e.title} (${fmtDay(e.date).toLowerCase()})`).join(', ') : null,
    meds.length ? 'Medicación: ' + meds.map(e => e.title + (e.dose ? ' ' + e.dose : '')).join(', ') : null,
    vets.length ? 'Últimas visitas:\n' + vets.slice(0, 3).map(e => `- ${fmtDay(e.date).toLowerCase()} · ${e.title}${e.text ? ': ' + e.text : ''}`).join('\n') : null].filter(Boolean).join('\n');
  if (navigator.share) navigator.share({title:'Ficha de ' + p.name, text:t}).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Ficha copiada'), () => toast('No se pudo copiar'));
  else toast('Este navegador no permite compartir');
}

let _photo = null;

      check:() => need('p-name', 'Ponle nombre')},
    {name:'Detalles', focus:'#p-breed',

    {name:'Salud', focus:'#p-clinic',
      html:fld('Clínica habitual', `<input id="p-clinic" value="${v('clinic')}">`) + fld('Alergias y condiciones', `<textarea id="p-cond" style="min-height:66px" placeholder="Alergias, medicación crónica, problemas conocidos…">${v('conditions')}</textarea>`) + fld('Notas', `<textarea id="p-notes" style="min-height:58px" placeholder="Carácter, manías…">${v('notes')}</textarea>`)}];
  wizard({title:id ? 'Editar mascota' : 'Nueva mascota', steps, save:savePet, onDelete:id ? (() => delPet(id)) : null});
}
function savePet(){
  const {id, color} = window._petEdit, g = x => document.getElementById(x).value.trim();
  const d = {name:g('p-name'), species:g('p-species'), sex:g('p-sex'), breed:g('p-breed'), birth:g('p-birth'), chip:g('p-chip'), notes:g('p-notes'), clinic:g('p-clinic'), conditions:g('p-cond'), color, photo:_photo};
  if (!d.name) return toast('Ponle nombre');
  if (id){ const cur = petById(id); if (cur) mergeEdit(cur, d, (window._petEdit && window._petEdit.snap) || cur); else S.pets.push({id, ...d}); } else S.pets.push({id:uid(), ...d});
  save(); closeSheet(); renderAll(); toast(id ? 'Cambios guardados' : `${d.name} ya está en PetBase`);
}
function delPet(id){
  const p = petById(id);
  if (!confirm(`¿Borrar a ${p.name}? Sus registros se conservan, pero dejarán de estar etiquetados con su nombre.`)) return;
  S.pets = S.pets.filter(x => x.id !== id);
  S.entries.forEach(e => { if (e.petIds) e.petIds = e.petIds.filter(x => x !== id); });
  if (fPet === id) fPet = null;
  save(); closeSheet(); renderAll(); toast('Mascota borrada');
}
// Foto: reduce a 320px JPEG para no inflar el almacenamiento
document.getElementById('photoIn').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const s = 320, c = document.createElement('canvas'); c.width = c.height = s;
    const r = Math.min(img.width, img.height), ctx = c.getContext('2d');
    ctx.drawImage(img, (img.width-r)/2, (img.height-r)/2, r, r, 0, 0, s, s);
    _photo = c.toDataURL('image/jpeg', .82); URL.revokeObjectURL(url);
    document.getElementById('pv').innerHTML = avatar({name:'?', color:_petEdit.color, photo:_photo});
  };
  img.src = url; ev.target.value = '';
});

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function dataJSON(){ const x = {...S}; ['account', 'outlook', 'meta', 'sync', 'walk', 'h', 'tomb', 'sh', 'su'].forEach(k => { delete x[k]; }); return {app:'PetBase', version:2, exportedAt:new Date().toISOString(), ...x}; }
function exportJSON(){ download(`petbase-${today()}.json`, JSON.stringify(dataJSON(), null, 2), 'application/json'); toast('Copia descargada'); }
document.getElementById('imp').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result); if (!p.pets || !p.entries) throw new Error('el archivo no es una copia de PetBase');
      if (!confirm(`¿Sustituir los datos actuales por ${p.pets.length} mascotas y ${p.entries.length} registros?`)) return;
      busy('Importando copia…', 1000, 'paws', () => { adoptState({...blank(), ...p, sacks:p.sacks || []}); save(); applyTheme(); renderAll(); toast('Copia importada'); });
    }catch(err){ toast('No se pudo importar: ' + err.message); }
  };
  r.readAsText(f); ev.target.value = '';
});
function rruleOf(e){
  const r = getRec(e); if (!r) return null;
  let x = 'RRULE:FREQ=' + ({h:'HOURLY', d:'DAILY', w:'WEEKLY', m:'MONTHLY', y:'YEARLY'})[r.u];
  if ((+r.n || 1) > 1) x += ';INTERVAL=' + r.n;
  if (r.end === 'count') x += ';COUNT=' + Math.max(1, (+r.count || 1) - ((e.occ || 1) - 1));
  if (r.end === 'until' && r.until) x += ';UNTIL=' + r.until.replace(/-/g, '') + (e.time ? 'T235959' : '');
  return x;
}
function buildICS(P){
  const icsEsc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ev = P.map(e => {
    const d = e.date.replace(/-/g, '');
    let dt;
    if (e.time){ const t = e.time.replace(':', '') + '00'; const end = new Date(parse(e.date).setHours(...e.time.split(':').map(Number)) + 3600000);
      dt = `DTSTART:${d}T${t}\r\nDTEND:${iso(end).replace(/-/g, '')}T${pad(end.getHours())}${pad(end.getMinutes())}00`; }
    else dt = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(e.date, 1).replace(/-/g, '')}`;
    const who = petNames(e.petIds);
    return ['BEGIN:VEVENT', `UID:${e.id}@petbase`, `DTSTAMP:${stamp}`, dt,
      `SUMMARY:${icsEsc((who ? who + ': ' : '') + entryTitle(e))}`,
      `DESCRIPTION:${icsEsc([TYPES[e.type].label, entrySub(e), e.text].filter(Boolean).join('\n'))}`,
      rruleOf(e), 'END:VEVENT'].filter(Boolean).join('\r\n');
  });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PetBase//ES', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n');
}
function exportICS(filtered){
  const P = filtered ? applyFlt(pending(), FLT.cal) : pending(); if (!P.length) return toast('No hay nada pendiente que exportar');
  download(`petbase-pendientes-${today()}.ics`, buildICS(P), 'text/calendar');
  toast('Calendario descargado · ' + P.length + (P.length === 1 ? ' evento' : ' eventos'));
}

let _tt;
const ERR_RE = /^(Indica|Inicia|Escribe|Ponle|Elige|Rellena|Primero|No se pudo|No hay|Este navegador)/;
function toast(msg, undo, kind){
  const t = document.getElementById('toast'), k = kind || (ERR_RE.test(msg) ? 'err' : 'ok'), ms = undo ? 5000 : 2600;
  t.className = 'toast ' + k;
  t.innerHTML = `<span class="tic">${svg(k === 'err' || k === 'warn' ? 'alert' : 'paw')}</span><span class="tmsg">${esc(msg)}</span>${undo ? '<button>Deshacer</button>' : ''}<i class="tbar" style="animation-duration:${ms}ms"></i>`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.classList.remove('on'); };
  void t.offsetWidth; t.classList.add('on'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('on'), ms);
}
